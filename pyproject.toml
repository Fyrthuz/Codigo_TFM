[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "codigo_tfm"
version = "2.0.0"
description = "Medical image segmentation with uncertainty estimation (2D & 3D)"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.5.0",
    "torchvision>=0.20.0",
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "matplotlib>=3.7.0",
    "scikit-learn>=1.3.0",
    "pandas>=2.0.0",
    "Pillow>=10.0.0",
    "tqdm>=4.65.0",
    "scikit-image>=0.21.0",
    "imageio>=2.28.0",
    "medpy>=0.4.0",
    "opencv-python>=4.8.0",
    "seaborn>=0.12.0",
    "PyYAML>=6.0",
    "ttach>=0.0.3",
    "kagglehub",
    "nibabel>=5.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "ruff>=0.1",
    "pre-commit>=3.0",
]
universeg = ["opencv-python>=4.8.0"]
crf = ["pydensecrf"]

# Note: pydensecrf is not compatible with Python 3.14 (Cython build fails).
#       CRF post-processing is disabled automatically when missing.
#       Use Python ≤3.11 and `pip install .[crf]` to enable CRF.

[project.urls]
Repository = "https://github.com/anomalyco/Codigo_TFM"

[tool.setuptools.packages.find]
where = ["src"]
include = ["codigo_tfm*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.ruff.format]
quote-style = "double"
